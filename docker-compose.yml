services:
  postgres:
    image: postgres:16-alpine
    container_name: somy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: somy
      POSTGRES_PASSWORD: somy_dev_password
      POSTGRES_DB: somy
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
